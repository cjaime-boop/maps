<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Recorrido</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #172033; --muted: #5d6779; --line: #dbe1ea;
  --accent: #1d5bd8; --accent-soft: #e6eefc; --route: #1d5bd8; --pin: #d63a2f;
  --warn: #9a5a00; --warn-soft: #fff3dc;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f141d; --surface: #182030; --ink: #e8edf6; --muted: #9aa5b8; --line: #2a3446;
  --accent: #6f9cf5; --accent-soft: #1f2d48; --route: #2f6fe4; --pin: #e2463b;
  --warn: #f2c06b; --warn-soft: #3a2e17; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.app { max-width: 720px; margin: 0 auto; background: var(--surface); height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden; }
header { padding: 9px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px));
  display: grid; gap: 5px; border-bottom: 1px solid var(--line); }
.marca { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { margin: 0; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; column-gap: 0; row-gap: 2px; font-size: 12.5px; color: var(--muted); }
.meta span + span::before { content: '·'; margin: 0 6px; color: var(--muted); }
.chip { white-space: nowrap; }
.chip.vence { color: var(--warn); font-weight: 600; }
#mapa { position: absolute; inset: 0; background: #e5e3df; }
.bot { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.num { width: 26px; height: 26px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 12px; font-weight: 700;
  display: grid; place-items: center; font-variant-numeric: tabular-nums; cursor: pointer; border: 0; padding: 0; }
.t { min-width: 0; cursor: pointer; }
.t b { display: block; font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere; }
.t small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.ir { font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 9px;
  padding: 8px 11px; white-space: nowrap; text-decoration: none; }
.pie { padding: 12px 16px 18px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 11px; padding: 12px; text-align: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; }
.btn.prim { background: var(--route); color: #fff; border-color: var(--route); }
.btn:focus-visible, .ir:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.aviso { padding: 40px 20px; text-align: center; display: grid; gap: 8px; }
.aviso b { font-size: 17px; }
.aviso span { color: var(--muted); }
.msg { font-size: 13px; color: var(--muted); text-align: center; min-height: 1em; }
.pinicon { background: var(--pin); color: #fff; border: 2px solid #fff; border-radius: 50%; font: 700 12px/22px var(--sans);
  text-align: center; width: 26px !important; height: 26px !important; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.yoicon { background: #1a73e8; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 6px rgba(26,115,232,.25); }
.leaflet-container { font-family: var(--sans); }
.mapawrap { position: relative; flex: 1; min-height: 0; --h: 40%; }
.hoja { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); z-index: 1001; background: var(--surface);
  border-top-left-radius: 16px; border-top-right-radius: 16px; box-shadow: 0 -4px 18px rgba(0,0,0,.22);
  display: flex; flex-direction: column; transition: height .18s ease; }
.hoja.arrastrando { transition: none; }
.asa { touch-action: none; cursor: grab; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px));
  display: grid; gap: 7px; border-bottom: 1px solid var(--line); }
.asa::before { content: ''; justify-self: center; width: 42px; height: 5px; border-radius: 3px; background: var(--line); }
.asa .fila { display: flex; align-items: center; gap: 8px; min-height: 34px; }
.asa .fila b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.asa .irsel { margin-left: auto; font-size: 13px; font-weight: 700; color: #fff; background: var(--route); border-radius: 9px;
  padding: 8px 11px; text-decoration: none; white-space: nowrap; max-width: 70%; overflow: hidden; text-overflow: ellipsis; }
.cuerpo { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.leaflet-bottom.leaflet-right { bottom: var(--h); }
.bot.sel { background: var(--accent-soft); }
.pinicon.sel { background: var(--route); transform: scale(1.18); z-index: 1000 !important; }
.ctl { width: 36px; height: 36px; line-height: 36px; text-align: center; background: #fff; color: #333; font-size: 17px;
  text-decoration: none; display: block; }
.ctl.on { background: #fff3dc; color: #9a5a00; }
.regla { position: absolute; left: 10px; right: 10px; bottom: calc(var(--h) + 10px); z-index: 1000; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.regla .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.regla .dist { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.regla .ayuda { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { font: inherit; font-size: 12.5px; font-weight: 600; border: 0; padding: 6px 10px; background: var(--surface); color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.mini { font: inherit; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 9px; padding: 6px 10px; cursor: pointer; margin-left: auto; }
.sitioicon { background: #16a34a; border: 2px solid #fff; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.sitioicon span { position: absolute; left: 18px; top: -3px; white-space: nowrap; font: 700 11px/1 var(--sans); color: #14532d;
  background: rgba(255,255,255,.9); padding: 2px 4px; border-radius: 4px; }
.medpt { background: #f59e0b; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="aviso" id="cargando"><b>Cargando recorrido…</b></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  var BASE = 'https://gnqvhlpknxtdnzuxfybc.supabase.co/storage/v1/object/public/recorridos/';
  var app = document.getElementById('app');
  var id = (location.hash || '').replace('#', '').trim();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function aviso(t, s) { app.innerHTML = '<div class="aviso"><b>' + esc(t) + '</b><span>' + esc(s) + '</span></div>'; }
  function ruta(lat, lon) { return 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lon; }

  if (!/^[A-Za-z0-9]{10}$/.test(id)) { aviso('Link incompleto', 'Revisá que hayas copiado el link entero.'); return; }

  fetch(BASE + id + '.json', {cache: 'no-store'}).then(function (r) {
    if (!r.ok) throw new Error('no');
    return r.json();
  }).then(mostrar).catch(function () {
    aviso('Este recorrido venció', 'Los links duran 24 horas. Pedile uno nuevo a quien te lo mandó.');
  });

  function metros(m) {
    return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2).replace('.', ',') + ' km';
  }

  // Ordena las botellas a lo largo del cable (de una punta a la otra), no por el orden en que vienen.
  function ordenar(bots, caminos) {
    var R = 6371000, rad = Math.PI / 180;
    function dist(a, b) {
      var x = (b[1] - a[1]) * rad * Math.cos((a[0] + b[0]) / 2 * rad), y = (b[0] - a[0]) * rad;
      return Math.sqrt(x * x + y * y) * R;
    }
    var N = [], A = [], segs = [];
    caminos.forEach(function (c) { (c.tramos || []).forEach(function (t) {
      var prev = -1;
      t.forEach(function (p) {
        N.push(p); A.push([]); var k = N.length - 1;
        if (prev >= 0) { var w = dist(N[prev], p); A[prev].push([k, w]); A[k].push([prev, w]); segs.push([prev, k]); }
        prev = k;
      });
    }); });
    if (!N.length || bots.length < 2 || N.length > 6000) return bots;
    for (var i = 0; i < N.length; i++) for (var j = i + 1; j < N.length; j++) {
      var dd = dist(N[i], N[j]); if (dd < 15) { A[i].push([j, dd]); A[j].push([i, dd]); }
    }
    function dijkstra(o) {
      var D = N.map(function () { return Infinity; }), V = [];
      D[o] = 0;
      for (;;) {
        var u = -1, du = Infinity;
        for (var k = 0; k < D.length; k++) if (!V[k] && D[k] < du) { du = D[k]; u = k; }
        if (u < 0) break; V[u] = true;
        A[u].forEach(function (e) { if (du + e[1] < D[e[0]]) D[e[0]] = du + e[1]; });
      }
      return D;
    }
    function lejos(D) { var m = 0; D.forEach(function (v, k) { if (v < Infinity && v > D[m]) m = k; }); return m; }
    var D = dijkstra(lejos(dijkstra(0)));
    return bots.map(function (b, idx) {
      var best = Infinity, pos = Infinity, P = [b.lat, b.lon];
      segs.forEach(function (s) {
        var a = N[s[0]], c = N[s[1]], cx = Math.cos(a[0] * rad);
        var ax = a[1] * cx, ay = a[0], bx = c[1] * cx, by = c[0], px = P[1] * cx, py = P[0];
        var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
        var t = l2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)) : 0;
        var q = [ay + t * dy, (ax + t * dx) / cx], d0 = dist(P, q);
        if (d0 < best) { best = d0; pos = Math.min(D[s[0]] + dist(a, q), D[s[1]] + dist(c, q)); }
      });
      return {b: b, pos: pos, idx: idx};
    }).sort(function (x, y) { return (x.pos - y.pos) || (x.idx - y.idx); }).map(function (x) { return x.b; });
  }

  // Hoja inferior: se arrastra desde la barrita para ver más mapa o más lista.
  function hojaArrastrable() {
    var hoja = document.getElementById('hoja'), asa = document.getElementById('asa'), wrap = hoja.parentNode;
    var min = 62, y0 = 0, h0 = 0, mov = false, activo = false;
    function poner(px) {
      var max = wrap.clientHeight * 0.9;
      px = Math.max(min, Math.min(max, px));
      wrap.style.setProperty('--h', px + 'px');
    }
    asa.addEventListener('pointerdown', function (e) {
      if (e.target.closest('a')) return;
      activo = true; mov = false; y0 = e.clientY; h0 = hoja.offsetHeight;
      hoja.classList.add('arrastrando'); asa.setPointerCapture(e.pointerId);
    });
    asa.addEventListener('pointermove', function (e) {
      if (!activo) return;
      if (Math.abs(e.clientY - y0) > 4) mov = true;
      poner(h0 + (y0 - e.clientY));
    });
    function soltar() {
      if (!activo) return;
      activo = false; hoja.classList.remove('arrastrando');
      var H = wrap.clientHeight, h = hoja.offsetHeight;
      var paradas = [min, H * 0.4, H * 0.9];
      if (!mov) { poner(h <= min + 5 ? H * 0.4 : min); return; }   // un toque: abre o cierra
      var mejor = paradas.reduce(function (a, b) { return Math.abs(b - h) < Math.abs(a - h) ? b : a; });
      poner(mejor);
    }
    asa.addEventListener('pointerup', soltar);
    asa.addEventListener('pointercancel', soltar);
  }

  function mostrar(d) {
    var vence = new Date(d.vence).getTime();
    var resta = vence - Date.now();
    if (!(resta > 0)) { aviso('Este recorrido venció', 'Los links duran 24 horas. Pedile uno nuevo a quien te lo mandó.'); return; }
    var horas = Math.max(1, Math.round(resta / 3600000));
    var nombres = [];
    (d.caminos || []).forEach(function (c) { if (c.nombre && nombres.indexOf(c.nombre) < 0) nombres.push(c.nombre); });
    var cliente = d.tipo === 'cliente';
    if (!cliente) d.titulo = nombres.length ? nombres.slice(0, 3).join(', ') + (nombres.length > 3 ? '…' : '') : (d.titulo || 'Recorrido');
    document.title = d.titulo;
    var bots = ordenar(d.botellas || [], d.caminos || []);
    var nc = nombres.length || (d.caminos || []).length;

    var h = '';
    h += '<header><h1>' + esc(d.titulo) + '</h1><div class="meta">';
    if (cliente) {
      if ((d.sitios || []).length) h += '<span class="chip">' + d.sitios.length + ' sitios</span>';
    } else if (nc > 1) h += '<span class="chip">' + nc + ' caminos ópticos</span>';
    h += '<span class="chip">' + bots.length + (bots.length === 1 ? ' botella' : ' botellas') + '</span>';
    h += '<span class="chip" id="largo"></span>';
    h += '<span class="chip vence">Vence en ' + horas + ' h</span></div></header>';
    h += '<div class="mapawrap"><div id="mapa" role="region" aria-label="Mapa del recorrido"></div>';
    h += '<div class="regla" id="regla" hidden>' +
         '<div class="fila"><span class="seg"><button type="button" id="mCable" class="on">Por el cable</button>' +
         '<button type="button" id="mRecta">En línea recta</button></span>' +
         '<button type="button" class="mini" id="mBorrar">Borrar</button><button type="button" class="mini" id="mCerrar" style="margin-left:0">Cerrar</button></div>' +
         '<div class="fila"><span class="dist" id="mDist">—</span></div>' +
         '<div class="ayuda" id="mAyuda"></div></div>';
    h += '<div class="hoja" id="hoja"><div class="asa" id="asa"><div class="fila"><b>' + bots.length +
         (bots.length === 1 ? ' botella' : ' botellas') + ' · tocá una</b>' +
         '<a class="irsel" id="irSel" hidden target="_blank" rel="noopener"></a></div></div><div class="cuerpo"><div class="lista">';
    bots.forEach(function (b, i) {
      h += '<div class="bot" id="b' + i + '"><button class="num" type="button" data-i="' + i + '" aria-label="Elegir botella ' + (i + 1) + '">' + (i + 1) + '</button>' +
           '<span class="t" data-i="' + i + '"><b>' + esc(b.nombre) + '</b>' + (b.sub ? '<small>' + esc(b.sub) + '</small>' : '') + '</span>' +
           '<a class="ir" href="' + ruta(b.lat, b.lon) + '" target="_blank" rel="noopener">Ir ↗</a></div>';
    });
    if (!bots.length) h += '<div class="bot"><span></span><span class="t"><small>Este recorrido no tiene botellas.</small></span><span></span></div>';
    h += '</div><div class="pie">';
    h += '<a class="btn" href="' + BASE + id + '.kml?download=' + encodeURIComponent((d.archivo || 'recorrido') + '.kml') + '">Descargar KML (para Google Earth)</a>';
    h += '<div class="msg" id="msg"></div></div></div></div></div>';
    app.innerHTML = h;
    hojaArrastrable();

    var css = getComputedStyle(document.documentElement);
    var colRuta = css.getPropertyValue('--route').trim() || '#1d5bd8';
    var mapa = L.map('mapa', {zoomControl: true, attributionControl: true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);
    var grupo = L.featureGroup().addTo(mapa);

    // ---- red del cable (para medir por el cable) ----
    var nodos = [], ady = [], largoTotal = 0;
    function nodo(ll) { nodos.push(L.latLng(ll[0], ll[1])); ady.push([]); return nodos.length - 1; }
    function unir(a, b, w) { ady[a].push([b, w]); ady[b].push([a, w]); }
    var tramos = [];
    (d.caminos || []).forEach(function (c) {
      (c.tramos || []).forEach(function (t) {
        L.polyline(t, {color: colRuta, weight: 5, opacity: .9}).bindTooltip(c.nombre || '').addTo(grupo);
        var ids = t.map(nodo);
        for (var k = 1; k < ids.length; k++) {
          var w = nodos[ids[k - 1]].distanceTo(nodos[ids[k]]);
          unir(ids[k - 1], ids[k], w); largoTotal += w;
          tramos.push([ids[k - 1], ids[k]]);
        }
      });
    });
    // empalmes: puntas de tramos que quedan a menos de 15 m se consideran unidas
    for (var a = 0; a < nodos.length; a++) for (var b = a + 1; b < nodos.length; b++) {
      if (nodos.length > 4000) break;
      var dd = nodos[a].distanceTo(nodos[b]);
      if (dd < 15 && !ady[a].some(function (e) { return e[0] === b; })) unir(a, b, dd);
    }
    if (largoTotal) document.getElementById('largo').textContent = metros(largoTotal) + ' de cable';
    else document.getElementById('largo').hidden = true;

    function proyectar(ll) {
      var best = null, P = mapa.project(ll, 18);
      tramos.forEach(function (s) {
        var A = mapa.project(nodos[s[0]], 18), B = mapa.project(nodos[s[1]], 18);
        var dx = B.x - A.x, dy = B.y - A.y, l2 = dx * dx + dy * dy;
        var t = l2 ? Math.max(0, Math.min(1, ((P.x - A.x) * dx + (P.y - A.y) * dy) / l2)) : 0;
        var Q = L.point(A.x + t * dx, A.y + t * dy), dist = Q.distanceTo(P);
        if (!best || dist < best.dist) best = {dist: dist, seg: s, q: mapa.unproject(Q, 18)};
      });
      return best;
    }
    function porCable(p1, p2) {
      // agrega los dos puntos proyectados como nodos temporales y busca el camino mas corto
      var n0 = nodos.length, base = ady.length;
      var extra = [p1, p2].map(function (p) {
        var a = p.seg[0], b = p.seg[1], id2 = nodos.length;
        nodos.push(p.q); ady.push([[a, p.q.distanceTo(nodos[a])], [b, p.q.distanceTo(nodos[b])]]);
        ady[a].push([id2, p.q.distanceTo(nodos[a])]); ady[b].push([id2, p.q.distanceTo(nodos[b])]);
        return id2;
      });
      if (p1.seg === p2.seg) { var w = p1.q.distanceTo(p2.q); ady[extra[0]].push([extra[1], w]); ady[extra[1]].push([extra[0], w]); }
      var dist = nodos.map(function () { return Infinity; }), prev = [], vis = [];
      dist[extra[0]] = 0;
      for (;;) {
        var u = -1, du = Infinity;
        for (var i = 0; i < dist.length; i++) if (!vis[i] && dist[i] < du) { du = dist[i]; u = i; }
        if (u < 0 || u === extra[1]) break;
        vis[u] = true;
        ady[u].forEach(function (e) { if (du + e[1] < dist[e[0]]) { dist[e[0]] = du + e[1]; prev[e[0]] = u; } });
      }
      var camino = [];
      if (dist[extra[1]] < Infinity) for (var x = extra[1]; x !== undefined; x = prev[x]) camino.unshift(nodos[x]);
      var res = {m: dist[extra[1]], linea: camino};
      // sacar los nodos temporales
      ady.forEach(function (l) { for (var k = l.length - 1; k >= 0; k--) if (l[k][0] >= n0) l.splice(k, 1); });
      nodos.length = n0; ady.length = base;
      return res;
    }

    // ---- botellas ----
    var sel = -1;
    // sitios (cuadrado verde con nombre) y camaras (punto naranja chico), solo en el mapa
    (d.sitios || []).forEach(function (s0) {
      L.marker([s0.lat, s0.lon], {icon: L.divIcon({className: 'sitioicon', html: '<span>' + esc(s0.nombre) + '</span>', iconSize: [16, 16]}),
        zIndexOffset: 500}).bindPopup('<b>Sitio ' + esc(s0.nombre) + '</b><br><a href="' + ruta(s0.lat, s0.lon) +
        '" target="_blank" rel="noopener">Cómo llegar ↗</a>').addTo(grupo);
    });
    (d.camaras || []).forEach(function (c0) {
      L.circleMarker([c0.lat, c0.lon], {radius: 4, color: '#fff', weight: 1.5, fillColor: '#f59e0b', fillOpacity: 1})
        .bindPopup('<b>Cámara</b> ' + esc(c0.nombre) + '<br><a href="' + ruta(c0.lat, c0.lon) +
        '" target="_blank" rel="noopener">Cómo llegar ↗</a>').addTo(grupo);
    });
    var marcas = bots.map(function (b, i) {
      var m = L.marker([b.lat, b.lon], {icon: L.divIcon({className: 'pinicon', html: String(i + 1), iconSize: [26, 26]})});
      m.on('click', function () { if (midiendo) agregarPunto(L.latLng(b.lat, b.lon), true); else elegir(i, false); });
      m.addTo(grupo);
      return m;
    });
    if (grupo.getLayers().length) mapa.fitBounds(grupo.getBounds(), {paddingTopLeft: [24, 24],
      paddingBottomRight: [24, document.getElementById('hoja').offsetHeight + 24]});
    else mapa.setView([-34.6, -58.45], 11);

    function elegir(i, centrar) {
      if (sel >= 0) { document.getElementById('b' + sel).classList.remove('sel'); L.DomUtil.removeClass(marcas[sel].getElement(), 'sel'); }
      sel = i;
      var b = bots[i];
      document.getElementById('b' + i).classList.add('sel');
      L.DomUtil.addClass(marcas[i].getElement(), 'sel');
      var bt = document.getElementById('irSel');
      bt.href = ruta(b.lat, b.lon);
      bt.textContent = 'Cómo llegar a la ' + (i + 1) + ' ↗';
      bt.hidden = false;
      if (centrar) {
        var hoja = document.getElementById('hoja'), wrap = hoja.parentNode, hh = hoja.offsetHeight;
        if (hh > wrap.clientHeight * 0.5) { hh = wrap.clientHeight * 0.4; wrap.style.setProperty('--h', hh + 'px'); }
        mapa.setView([b.lat, b.lon], Math.max(mapa.getZoom(), 17), {animate: false});
        mapa.panBy([0, hh / 2], {animate: false});
      }
    }
    app.querySelectorAll('[data-i]').forEach(function (el) {
      el.addEventListener('click', function () { elegir(+el.getAttribute('data-i'), true); });
    });

    // ---- regla ----
    var midiendo = false, modo = 'cable', pts = [], capaMed = L.layerGroup().addTo(mapa);
    var regla = document.getElementById('regla');
    function ayuda() {
      document.getElementById('mAyuda').textContent = modo === 'cable'
        ? (tramos.length ? 'Tocá dos puntos sobre el cable (o dos botellas) para medir el tramo.' : 'Este recorrido no tiene cable dibujado.')
        : 'Tocá puntos en el mapa. Se suma la distancia en línea recta.';
    }
    function dibujar() {
      capaMed.clearLayers();
      var txt = '—';
      pts.forEach(function (p) { L.marker(p.ll, {icon: L.divIcon({className: 'medpt', iconSize: [14, 14]}), interactive: false}).addTo(capaMed); });
      if (modo === 'recta' && pts.length > 1) {
        var lls = pts.map(function (p) { return p.ll; }), m = 0;
        for (var k = 1; k < lls.length; k++) m += lls[k - 1].distanceTo(lls[k]);
        L.polyline(lls, {color: '#f59e0b', weight: 4, dashArray: '8 6'}).addTo(capaMed);
        txt = metros(m) + ' en línea recta';
      } else if (modo === 'cable' && pts.length === 2) {
        var r = porCable(pts[0].p, pts[1].p);
        if (r.m < Infinity) {
          L.polyline(r.linea, {color: '#f59e0b', weight: 7, opacity: .9}).addTo(capaMed);
          txt = metros(r.m) + ' por el cable';
        } else txt = 'Esos dos puntos no están unidos por el cable';
      } else if (modo === 'cable' && pts.length === 1) txt = 'Tocá el segundo punto';
      document.getElementById('mDist').textContent = txt;
    }
    function agregarPunto(ll, esBotella) {
      if (modo === 'cable') {
        if (!tramos.length) return;
        var p = proyectar(ll);
        if (!p) return;
        if (pts.length >= 2) pts = [];
        pts.push({ll: p.q, p: p});
      } else {
        pts.push({ll: ll});
      }
      dibujar();
    }
    function setModo(m) {
      modo = m; pts = [];
      document.getElementById('mCable').classList.toggle('on', m === 'cable');
      document.getElementById('mRecta').classList.toggle('on', m === 'recta');
      ayuda(); dibujar();
    }
    function regla_(on) {
      midiendo = on; regla.hidden = !on; btnRegla.classList.toggle('on', on);
      if (!on) { pts = []; capaMed.clearLayers(); }
      else { ayuda(); dibujar(); }
    }
    mapa.on('click', function (e) { if (midiendo) agregarPunto(e.latlng, false); });
    document.getElementById('mCable').onclick = function () { setModo('cable'); };
    document.getElementById('mRecta').onclick = function () { setModo('recta'); };
    document.getElementById('mBorrar').onclick = function () { pts = []; dibujar(); };
    document.getElementById('mCerrar').onclick = function () { regla_(false); };

    var btnRegla;
    var Herr = L.Control.extend({ options: {position: 'topright'}, onAdd: function () {
      var box = L.DomUtil.create('div', 'leaflet-bar');
      btnRegla = L.DomUtil.create('a', 'ctl', box);
      btnRegla.href = '#'; btnRegla.title = 'Medir'; btnRegla.setAttribute('role', 'button'); btnRegla.innerHTML = '📏';
      var yoB = L.DomUtil.create('a', 'ctl', box);
      yoB.href = '#'; yoB.title = 'Mi ubicación'; yoB.setAttribute('role', 'button'); yoB.innerHTML = '◎'; yoB.style.color = '#1a73e8';
      L.DomEvent.disableClickPropagation(box);
      L.DomEvent.on(btnRegla, 'click', function (e) { L.DomEvent.preventDefault(e); regla_(!midiendo); });
      L.DomEvent.on(yoB, 'click', function (e) { L.DomEvent.preventDefault(e); ubicar(); });
      return box;
    }});
    mapa.addControl(new Herr());
    L.DomEvent.disableClickPropagation(regla);

    var yo = null;
    function ubicar() {
      var msg = document.getElementById('msg');
      if (!navigator.geolocation) { msg.textContent = 'Este celular no comparte la ubicación.'; return; }
      msg.textContent = 'Buscando tu ubicación…';
      navigator.geolocation.getCurrentPosition(function (pos) {
        msg.textContent = '';
        var p = [pos.coords.latitude, pos.coords.longitude];
        if (yo) yo.setLatLng(p); else yo = L.marker(p, {icon: L.divIcon({className: 'yoicon', iconSize: [16, 16]}), interactive: false}).addTo(mapa);
        mapa.setView(p, 16);
      }, function () {
        msg.textContent = 'No pude obtener tu ubicación. Revisá que el permiso de ubicación esté activado.';
      }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
    }
  }
})();
</script>
</body>
</html>
