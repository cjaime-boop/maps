<style>

  background: var(--surface); color: var(--ink); }

.corteicon { background: #111827; color: #facc15; border: 2.5px solid #facc15; border-radius: 8px; font: 700 16px/23px var(--sans);
  text-align: center; box-shadow: 0 0 0 2px #111827, 0 2px 6px rgba(0,0,0,.5); position: relative; }
.corteicon::after { content: ''; position: absolute; inset: -8px; border: 3px solid #facc15; border-radius: 12px;
  animation: latido 1.6s ease-out infinite; pointer-events: none; }

<body>
<div class="app" id="app">
  <div class="aviso" id="cargando"><b>Cargando recorrido…</b></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  var BASE = 'https://gnqvhlpknxtdnzuxfybc.supabase.co/storage/v1/object/public/recorridos/';
  var app = document.getElementById('app');
  var id = (location.hash || '').replace('#', '').trim();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function aviso(t, s) { app.innerHTML = '<div class="aviso"><b>' + esc(t) + '</b><span>' + esc(s) + '</span></div>'; }
  function ruta(lat, lon) { return 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lon; }

  if (!/^[A-Za-z0-9]{10}$/.test(id)) { aviso('Link incompleto', 'Revisá que hayas copiado el link entero.'); return; }

  fetch(BASE + id + '.json?v=' + Date.now(), {cache: 'no-store'}).then(function (r) {
    if (!r.ok) throw new Error('no');
    return r.json();
  }).then(mostrar).catch(function () {
    aviso('Este link ya no está disponible', 'Venció (duran 24 horas) o lo dieron de baja. Pedile uno nuevo a quien te lo mandó.');
  });

  function metros(m) {
    return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2).replace('.', ',') + ' km';
  }

  // Dijkstra con cola de prioridad (rápido aunque el cable tenga miles de vértices)
  function caminoMinimo(n, ady, o, hasta) {
    var dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), h = [[0, o]];
    dist[o] = 0;
    function push(x) { h.push(x); var i = h.length - 1; while (i > 0) { var p = (i - 1) >> 1; if (h[p][0] <= h[i][0]) break; var t = h[p]; h[p] = h[i]; h[i] = t; i = p; } }
    function pop() {
      var top = h[0], last = h.pop();
      if (h.length) { h[0] = last; var i = 0;
        for (;;) { var l = 2 * i + 1, r = l + 1, m = i;
          if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r;
          if (m === i) break; var t = h[m]; h[m] = h[i]; h[i] = t; i = m; } }
      return top;
    }
    while (h.length) {
      var it = pop(), du = it[0], u = it[1];
      if (du > dist[u]) continue;
      if (u === hasta) break;
      var es = ady[u];
      for (var k = 0; k < es.length; k++) { var v = es[k][0], nd = du + es[k][1]; if (nd < dist[v]) { dist[v] = nd; prev[v] = u; push([nd, v]); } }
    }
    return {dist: dist, prev: prev};
  }

  // Ordena las botellas a lo largo del cable (de una punta a la otra), no por el orden en que vienen.
  function ordenar(bots, caminos) {
    var R = 6371000, rad = Math.PI / 180;
    function dist(a, b) {
      var x = (b[1] - a[1]) * rad * Math.cos((a[0] + b[0]) / 2 * rad), y = (b[0] - a[0]) * rad;
      return Math.sqrt(x * x + y * y) * R;
    }
    var N = [], A = [], segs = [];
    caminos.forEach(function (c) { (c.tramos || []).forEach(function (t) {
      var prev = -1;
      t.forEach(function (p) {
        N.push(p); A.push([]); var k = N.length - 1;
        if (prev >= 0) { var w = dist(N[prev], p); A[prev].push([k, w]); A[k].push([prev, w]); segs.push([prev, k]); }
        prev = k;
      });
    }); });
    if (!N.length || bots.length < 2 || N.length > 6000) return bots;
    for (var i = 0; i < N.length; i++) for (var j = i + 1; j < N.length; j++) {
      var dd = dist(N[i], N[j]); if (dd < 15) { A[i].push([j, dd]); A[j].push([i, dd]); }
    }
    function dijkstra(o) { return Array.from(caminoMinimo(N.length, A, o).dist); }
    function lejos(D) { var m = 0; D.forEach(function (v, k) { if (v < Infinity && v > D[m]) m = k; }); return m; }
    var D = dijkstra(lejos(dijkstra(0)));
    return bots.map(function (b, idx) {
      var best = Infinity, pos = Infinity, P = [b.lat, b.lon];
      segs.forEach(function (s) {
        var a = N[s[0]], c = N[s[1]], cx = Math.cos(a[0] * rad);
        var ax = a[1] * cx, ay = a[0], bx = c[1] * cx, by = c[0], px = P[1] * cx, py = P[0];
        var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
        var t = l2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)) : 0;
        var q = [ay + t * dy, (ax + t * dx) / cx], d0 = dist(P, q);
        if (d0 < best) { best = d0; pos = Math.min(D[s[0]] + dist(a, q), D[s[1]] + dist(c, q)); }
      });
      return {b: b, pos: pos, idx: idx};
    }).sort(function (x, y) { return (x.pos - y.pos) || (x.idx - y.idx); }).map(function (x) { return x.b; });
  }

  // Hoja inferior: se arrastra desde la barrita para ver más mapa o más lista.
  function hojaArrastrable() {
    var hoja = document.getElementById('hoja'), asa = document.getElementById('asa'), wrap = hoja.parentNode;
    var min = 62, y0 = 0, h0 = 0, mov = false, activo = false;
    function poner(px) {
      var max = wrap.clientHeight * 0.9;
      px = Math.max(min, Math.min(max, px));
      wrap.style.setProperty('--h', px + 'px');
    }
    asa.addEventListener('pointerdown', function (e) {
      if (e.target.closest('a, .busca')) return;
      activo = true; mov = false; y0 = e.clientY; h0 = hoja.offsetHeight;
      hoja.classList.add('arrastrando'); asa.setPointerCapture(e.pointerId);
    });
    asa.addEventListener('pointermove', function (e) {
      if (!activo) return;
      if (Math.abs(e.clientY - y0) > 4) mov = true;
      poner(h0 + (y0 - e.clientY));
    });
    function soltar() {
      if (!activo) return;
      activo = false; hoja.classList.remove('arrastrando');
      var H = wrap.clientHeight, h = hoja.offsetHeight;
      var paradas = [min, H * 0.4, H * 0.9];
      if (!mov) { poner(h <= min + 5 ? H * 0.4 : min); return; }   // un toque: abre o cierra
      var mejor = paradas.reduce(function (a, b) { return Math.abs(b - h) < Math.abs(a - h) ? b : a; });
      poner(mejor);
    }
    asa.addEventListener('pointerup', soltar);
    asa.addEventListener('pointercancel', soltar);
  }

  function mostrar(d) {
    var vence = new Date(d.vence).getTime();
    var resta = vence - Date.now();
    if (!(resta > 0)) { aviso('Este recorrido venció', 'Los links duran 24 horas. Pedile uno nuevo a quien te lo mandó.'); return; }
    var horas = Math.max(1, Math.round(resta / 3600000));
    var nombres = [];
    (d.caminos || []).forEach(function (c) { if (c.nombre && nombres.indexOf(c.nombre) < 0) nombres.push(c.nombre); });
    var cliente = d.tipo === 'cliente';
    if (!cliente) d.titulo = nombres.length ? nombres.slice(0, 3).join(', ') + (nombres.length > 3 ? '…' : '') : (d.titulo || 'Recorrido');
    document.title = d.titulo;
    var bots = ordenar(d.botellas || [], d.caminos || []);
    var nc = nombres.length || (d.caminos || []).length;

    var h = '';
    h += '<header><div class="tit"><h1>' + esc(d.titulo) + '</h1>' +

    var css = getComputedStyle(document.documentElement);
    var colRuta = css.getPropertyValue('--route').trim() || '#1d5bd8';
    var mapa = L.map('mapa', {zoomControl: true, attributionControl: true});

      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);
    var grupo = L.featureGroup().addTo(mapa);

    // ---- red del cable (para medir por el cable) ----
    var nodos = [], ady = [], largoTotal = 0;
    var porClave = {};
    function nodo(ll) {   // el mismo punto en dos tramos es un solo nodo (cruces y empalmes exactos)
      var k = (+ll[0]).toFixed(7) + ',' + (+ll[1]).toFixed(7);
      if (k in porClave) return porClave[k];
      nodos.push(L.latLng(ll[0], ll[1])); ady.push([]); return (porClave[k] = nodos.length - 1);
    }
    function unir(a, b, w) { ady[a].push([b, w]); ady[b].push([a, w]); }
    var tramos = [], puntas = [], esPunta = {}, vistos = {};
    function clave(t) { return t.map(function (p) { return (+p[0]).toFixed(7) + ',' + (+p[1]).toFixed(7); }).join(';'); }
    (d.caminos || []).forEach(function (c) {
      (c.tramos || []).forEach(function (t) {
        if (!t || t.length < 2) return;
        var k1 = clave(t), k2 = clave(t.slice().reverse());
        if (vistos[k1] || vistos[k2]) return;   // tramo repetido: no se cuenta dos veces
        vistos[k1] = 1;
        L.polyline(t, {color: colRuta, weight: 5, opacity: .9}).bindTooltip(c.nombre || '').addTo(grupo);
        var ids = t.map(nodo);
        for (var k = 1; k < ids.length; k++) {
          var w = nodos[ids[k - 1]].distanceTo(nodos[ids[k]]);
          if (ids[k - 1] === ids[k]) continue;
          unir(ids[k - 1], ids[k], w); largoTotal += w;
          tramos.push([ids[k - 1], ids[k]]);
        }
        [ids[0], ids[ids.length - 1]].forEach(function (k) { if (!esPunta[k]) { esPunta[k] = 1; puntas.push(k); } });
      });
    });
    // pares de puntas a menos de maxM (grilla: anda con miles de puntos), ordenados por distancia
    function pares(lista, maxM) {
      var cel = maxM / 111000, g = {}, out = [];
      lista.forEach(function (k) {
        var n = nodos[k], key = Math.floor(n.lat / cel) + ',' + Math.floor(n.lng / cel);
        (g[key] = g[key] || []).push(k);
      });
      lista.forEach(function (k) {
        var n = nodos[k], i = Math.floor(n.lat / cel), j = Math.floor(n.lng / cel);
        for (var di = -1; di <= 1; di++) for (var dj = -2; dj <= 2; dj++) {
          (g[(i + di) + ',' + (j + dj)] || []).forEach(function (o) {
            if (o > k) { var dd = n.distanceTo(nodos[o]); if (dd < maxM) out.push([dd, k, o]); }
          });

      return out.sort(function (x, y) { return x[0] - y[0]; });
    }
    function unidos(a, b) { return ady[a].some(function (e) { return e[0] === b; }); }
    // empalmes: solo entre puntas de tramos. Las que se tocan (<1 m) se unen; después cada punta
    // que quedó suelta se une con la suelta más cercana (<15 m). Así no se cruza entre la ida y
    // la vuelta de un cable que va y viene por el mismo camino.
    var cerca = pares(puntas, 15);
    cerca.forEach(function (p) { if (p[0] < 1 && !unidos(p[1], p[2])) unir(p[1], p[2], p[0]); });
    var suelta = {}; puntas.forEach(function (k) { if (ady[k].length <= 1) suelta[k] = 1; });
    var mejor = {};
    cerca.forEach(function (p) {
      if (p[0] < 1 || !suelta[p[1]] || !suelta[p[2]]) return;
      if (!(p[1] in mejor)) mejor[p[1]] = p;
      if (!(p[2] in mejor)) mejor[p[2]] = p;
    });
    Object.keys(mejor).forEach(function (k) { var p = mejor[k]; if (!unidos(p[1], p[2])) unir(p[1], p[2], p[0]); });
    // si el cable quedó partido en pedazos (huecos de dibujo de más de 15 m), se unen los pedazos
    // por las puntas más cercanas, hasta 60 m. Solo une pedazos separados: no agrega atajos.
    (function () {
      var comp = new Array(nodos.length).fill(-1), nc = 0;
      for (var s = 0; s < nodos.length; s++) {
        if (comp[s] >= 0) continue;
        var pila = [s]; comp[s] = nc;
        while (pila.length) { var u = pila.pop(); ady[u].forEach(function (e) { if (comp[e[0]] < 0) { comp[e[0]] = nc; pila.push(e[0]); } }); }
        nc++;
      }
      if (nc < 2) return;
      var padre = []; for (var c = 0; c < nc; c++) padre.push(c);
      function raiz(x) { while (padre[x] !== x) { padre[x] = padre[padre[x]]; x = padre[x]; } return x; }
      pares(puntas, 60.001).forEach(function (p) {
        var ra = raiz(comp[p[1]]), rb = raiz(comp[p[2]]);
        if (ra !== rb) { padre[ra] = rb; unir(p[1], p[2], p[0]); }
      });
    })();
    if (largoTotal) document.getElementById('largo').textContent = metros(largoTotal) + ' de cable';
    else document.getElementById('largo').hidden = true;

    function proyectar(ll) {
      var best = null, P = mapa.project(ll, 18);
      tramos.forEach(function (s) {
        var A = mapa.project(nodos[s[0]], 18), B = mapa.project(nodos[s[1]], 18);
        var dx = B.x - A.x, dy = B.y - A.y, l2 = dx * dx + dy * dy;
        var t = l2 ? Math.max(0, Math.min(1, ((P.x - A.x) * dx + (P.y - A.y) * dy) / l2)) : 0;
        var Q = L.point(A.x + t * dx, A.y + t * dy), dist = Q.distanceTo(P);
        if (!best || dist < best.dist) best = {dist: dist, seg: s, q: mapa.unproject(Q, 18)};
      });
      return best;
    }
    // nodos temporales sobre el cable (puntos tocados), se agregan y se sacan en cada calculo
    function conTemporales(ps, fn) {
      var n0 = nodos.length;
      var ids = ps.map(function (p) {
        var a = p.seg[0], b = p.seg[1], k = nodos.length;
        nodos.push(p.q); ady.push([[a, p.q.distanceTo(nodos[a])], [b, p.q.distanceTo(nodos[b])]]);
        ady[a].push([k, p.q.distanceTo(nodos[a])]); ady[b].push([k, p.q.distanceTo(nodos[b])]);
        return k;
      });
      for (var x = 0; x < ps.length; x++) for (var y = x + 1; y < ps.length; y++) if (ps[x].seg === ps[y].seg) {
        var w = ps[x].q.distanceTo(ps[y].q); ady[ids[x]].push([ids[y], w]); ady[ids[y]].push([ids[x], w]);
      }
      try { return fn(ids); }
      finally {
        ady.forEach(function (l) { for (var k = l.length - 1; k >= 0; k--) if (l[k][0] >= n0) l.splice(k, 1); });
        nodos.length = n0; ady.length = n0;
      }

    function dijkstra(o, hasta) {
      var r = caminoMinimo(nodos.length, ady, o, hasta), prev = [];
      for (var i = 0; i < r.prev.length; i++) prev[i] = r.prev[i] >= 0 ? r.prev[i] : undefined;
      return {dist: Array.from(r.dist), prev: prev};
    }

      var out = [];

    }

        var r = dijkstra(ids[0], ids[1]);
        return {m: r.dist[ids[1]], linea: r.dist[ids[1]] < Infinity ? linea(r.prev, ids[1]) : []};
      });
    }
    // primera bifurcación: posiciones que salen para el mismo lado y se separan más adelante (null si no hay)
    function bifurcacion(cands) {
      var porSalida = {}, mejor = null;
      cands.forEach(function (c, i) { var k = c.ids.length > 1 ? c.ids[1] : -1; (porSalida[k] = porSalida[k] || []).push(i); });
      Object.keys(porSalida).forEach(function (k) {
        var g = porSalida[k];
        if (g.length < 2) return;
        var p = 0;
        while (g.every(function (i) { return cands[i].ids.length > p && cands[i].ids[p] === cands[g[0]].ids[p]; })) p++;
        if (p === 0 || !g.every(function (i) { return cands[i].ids.length > p; })) return;
        var ramas = {}, orden = [];
        g.forEach(function (i) { var r = cands[i].ids[p]; if (!ramas[r]) { ramas[r] = []; orden.push(r); } ramas[r].push(i); });
        if (orden.length < 2) return;
        var comun = cands[g[0]].linea.slice(0, p), m = 0;
        for (var j = 1; j < comun.length; j++) m += comun[j - 1].distanceTo(comun[j]);
        if (!mejor || m < mejor.metros)

      vistos[sig] = 1;
      var out = [nodos[desde], nodos[sig]], largo = nodos[desde].distanceTo(nodos[sig]), x = sig;
      while (largo < 3000) {
        var otros = ady[x].filter(function (e) { return !vistos[e[0]]; });
        if (otros.length !== 1) break;
        vistos[otros[0][0]] = 1; largo += otros[0][1]; x = otros[0][0]; out.push(nodos[x]);
      }
      return out;
    }
    var elegidas = [];   // ramas elegidas en las bifurcaciones (nodo de salida de cada rama)
    var COL_RAMA = ['#9333ea', '#16a34a', '#db2777', '#0891b2', '#ea580c'], NOM_RAMA = ['violeta', 'verde', 'rosa', 'celeste', 'naranja'];
    // puntos del cable que quedan a D metros (por el cable) del punto p, en cada direccion

        var r = dijkstra(ids[0]), dist = r.dist, prev = r.prev, out = [], maximo = 0;

            if (out.some(function (o) { return o.q.distanceTo(q) < 5; })) return;
            var ids = [];

    // ---- botellas ----
    var sel = -1;

    function tocable(capa, html, ll) {
      capa.on('click', function (e) {
        L.DomEvent.stopPropagation(e);

        else L.popup().setLatLng(ll).setContent(html).openOn(mapa);
      });
      capa.addTo(grupo);
    }
    (d.sitios || []).forEach(function (s0) {
      tocable(L.marker([s0.lat, s0.lon], {icon: L.divIcon({className: 'sitioicon', html: '<span>' + esc(s0.nombre) + '</span>', iconSize: [16, 16]}),
        zIndexOffset: 500}), '<b>Sitio ' + esc(s0.nombre) + '</b><br><a href="' + ruta(s0.lat, s0.lon) +
        '" target="_blank" rel="noopener">Cómo llegar ↗</a>', [s0.lat, s0.lon]);
    });
    (d.camaras || []).forEach(function (c0) {
      tocable(L.circleMarker([c0.lat, c0.lon], {radius: 4, color: '#fff', weight: 1.5, fillColor: '#f59e0b', fillOpacity: 1}),
        '<b>Cámara</b> ' + esc(c0.nombre) + '<br><a href="' + ruta(c0.lat, c0.lon) +
        '" target="_blank" rel="noopener">Cómo llegar ↗</a>', [c0.lat, c0.lon]);
    });
    var marcas = bots.map(function (b, i) {
      var m = L.marker([b.lat, b.lon], {icon: L.divIcon({className: 'pinicon', html: String(i + 1), iconSize: [26, 26]})});
      m.on('click', function () { if (midiendo) agregarPunto(L.latLng(b.lat, b.lon)); else { elegir(i, false); flotante(i); } });
      m.addTo(grupo);
      return m;
    });
    // ---- nombre de cada cable escrito sobre la línea (como las etiquetas de QGIS); se ven de cerca ----
    var capaCables = L.layerGroup(), ZOOM_CABLES = 15;
    (d.cables || []).forEach(function (c) {
      (c.tramos || []).forEach(function (t) {
        if (!t || t.length < 2) return;
        var lls = t.map(function (p) { return L.latLng(p[0], p[1]); }), acum = [0];
        for (var i = 1; i < lls.length; i++) acum.push(acum[i - 1] + lls[i - 1].distanceTo(lls[i]));
        var largo = acum[acum.length - 1];
        if (largo < 25) return;
        var n = Math.max(1, Math.floor(largo / 450));          // una etiqueta cada ~450 m
        for (var k = 0; k < n; k++) {
          var m = largo * (k + .5) / n, j = 1;
          while (j < acum.length - 1 && acum[j] < m) j++;
          var a = lls[j - 1], b = lls[j], f = (m - acum[j - 1]) / ((acum[j] - acum[j - 1]) || 1);
          var p = L.latLng(a.lat + (b.lat - a.lat) * f, a.lng + (b.lng - a.lng) * f);
          var dx = (b.lng - a.lng) * Math.cos(a.lat * Math.PI / 180), dy = b.lat - a.lat;
          var ang = -Math.atan2(dy, dx) * 180 / Math.PI;
          if (ang > 90) ang -= 180; else if (ang < -90) ang += 180;   // que el texto no quede al revés
          L.marker(p, {icon: L.divIcon({className: 'cableicon', iconSize: [0, 0],
            html: '<span style="transform:translate(-50%,-50%) rotate(' + ang.toFixed(1) + 'deg) translateY(-9px)">' + esc(c.nombre) + '</span>'}),
            interactive: false, keyboard: false}).addTo(capaCables);
        }

    });
    function verCables() {
      if (mapa.getZoom() >= ZOOM_CABLES) { if (!mapa.hasLayer(capaCables)) capaCables.addTo(mapa); }
      else if (mapa.hasLayer(capaCables)) mapa.removeLayer(capaCables);

    if (grupo.getLayers().length) mapa.fitBounds(grupo.getBounds(), {paddingTopLeft: [24, 24],
      paddingBottomRight: [24, document.getElementById('hoja').offsetHeight + 24]});
    else mapa.setView([-34.6, -58.45], 11);
    verCables();

    function elegir(i, centrar) {
      if (sel >= 0) { document.getElementById('b' + sel).classList.remove('sel'); L.DomUtil.removeClass(marcas[sel].getElement(), 'sel'); }
      sel = i;
      var b = bots[i];
      document.getElementById('b' + i).classList.add('sel');
      L.DomUtil.addClass(marcas[i].getElement(), 'sel');
      if (!centrar) {                 // tocada en el mapa: la lista va a esa botella, sin abrirla si está cerrada
        var fila = document.getElementById('b' + i), cu = document.querySelector('.cuerpo');
        var ib = document.getElementById('buscar');
        if (fila.classList.contains('oculta') && ib) { ib.value = ''; ib.dispatchEvent(new Event('input')); }
        setTimeout(function () {

    // ---- buscador de botellas: filtra la lista mientras escribís (sin importar mayúsculas ni acentos) ----
    var inBus = document.getElementById('buscar');
    if (inBus) {
      var norm = function (t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[\s_\-.]+/g, ''); };
      var textos = bots.map(function (b, i) { return norm(b.nombre) + '|' + norm(b.sub); });
      var visibles = [];
      var filtrar = function () {
        var q = norm(inBus.value);
        visibles = [];
        bots.forEach(function (b, i) {

          document.getElementById('b' + i).classList.toggle('oculta', !ok);

        var hoja = document.getElementById('hoja'), wrap = hoja.parentNode;

          if (normEnl(g[0]) !== enlaceLink) return;
          g[1].forEach(function (r) {
            out.push([celdasFibra(r[2]), r[6] ? [['', null, null], puerto(r[4])] : celdasFibra(r[4]), T[r[1]], T[r[3]]]);
          });
        });
        return out;
      }
      if (b.f && b.f.length) {
        var fc = b.fc || [], vis = {};
        b.f.forEach(function (x) {
          if (normEnl(x[0]) !== enlaceLink) return;
          var k1 = x[1] + ':' + x[2] + '|' + x[3] + ':' + x[4], k2 = x[3] + ':' + x[4] + '|' + x[1] + ':' + x[2];
          if (vis[k1] || vis[k2]) return; vis[k1] = 1;
          out.push([celdasFibra(x[2]), celdasFibra(x[4]), fc[x[1]], fc[x[3]]]);
        });
        out.sort(function (p, q) { return String(p[0][1][0]).localeCompare(String(q[0][1][0]), 'es', {numeric: true}); });
        return out;
      }
      return null;
    }
    function pastilla(c) {
      if (!c[1]) return '<span class="pf vacio">' + esc(c[0]) + '</span>';
      var blanco = /^#?f{6}$/i.test(c[1]);
      return '<span class="pf" style="background:' + c[1] + ';color:' + (c[2] || '#000') + (blanco ? ';box-shadow:inset 0 0 0 1px #d1d5db' : '') + '">' + esc(c[0]) + '</span>';
    }
    var popBot = null;
    function flotante(i) {
      var b = bots[i], filas = filasDelEnlace(b), h = '<div class="flot"><b class="fn">' + esc(b.nombre) + '</b>';
      if (filas && filas.length) {
        h += '<div class="fl">Fibra del enlace</div><div class="fg">';
        var cables = {};
        filas.forEach(function (f) {
          h += pastilla(f[0][0]) + pastilla(f[0][1]) + '<span class="fa">→</span>' + pastilla(f[1][0]) + pastilla(f[1][1]);
          cables[f[2] + ' → ' + f[3]] = 1;
        });
        h += '</div><div class="fcab">' + Object.keys(cables).map(esc).join('<br>') + '</div>';
      } else if (filas) h += '<div class="fl">Sin información</div>';
      h += '<div class="fb">' + ((b.h || (b.f && b.f.length)) ? '<button type="button" class="fpdf">PDF</button>' : '') +
           '<a class="fir" href="' + ruta(b.lat, b.lon) + '" target="_blank" rel="noopener">Ir ↗</a></div></div>';
      popBot = L.popup({maxWidth: 320, autoPanPaddingTopLeft: [10, 70], autoPanPaddingBottomRight: [10, 20]})
        .setLatLng([b.lat, b.lon]).setContent(h).openOn(mapa);
      var bt = popBot.getElement().querySelector('.fpdf');
      if (bt) bt.addEventListener('click', function () { abrirPDF(i, bt); });
    }

    function abrirPDF(i, boton) {
      var b = bots[i], txt = boton.textContent;
      boton.textContent = '…'; boton.disabled = true;
      cargarJsPDF().then(function () {
        var doc = hacerPDF(b), nombre = 'Enlaces_' + String(b.nombre).replace(/[^\w.-]+/g, '_') + '.pdf';
        var blob = doc.output('blob'), url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
        if (/Android/i.test(navigator.userAgent)) a.download = nombre;   // Android lo abre desde descargas
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      }).catch(function () { alert('No pude armar el PDF (¿sin conexión?).'); })
        .then(function () { boton.textContent = txt; boton.disabled = false; });
    }
    document.querySelector('.lista').addEventListener('click', function (e) {
      var bt = e.target.closest && e.target.closest('[data-fus]');
      if (bt) { e.stopPropagation(); abrirPDF(+bt.getAttribute('data-fus'), bt); }
    });

    function mm(m) { return Math.round(m).toLocaleString('es-AR') + ' m'; }
    // ---- regla: por el cable (varios puntos), en linea recta, y punto de corte ----
    var midiendo = false, modo = 'cable', pts = [], capaMed = L.layerGroup().addTo(mapa);
    var regla = document.getElementById('regla');
    var inGan = document.getElementById('mGan'), inMet = document.getElementById('mMetros');
    try { var g0 = localStorage.getItem('ganancia'); if (g0) inGan.value = g0; } catch (e) {}
    function gan() { var g = parseFloat(String(inGan.value).replace(',', '.')); return isFinite(g) && g >= 0 && g < 90 ? g : 15; }
    function conGanancia(m) {
      return '<small class="gan">Descontando ' + gan() + '% de ganancia: ' + mm(m * (1 - gan() / 100)) + '</small>';
    }
    function ayuda() {
      var t = {cable: 'Tocá puntos sobre el cable (o botellas). Se suma el recorrido por el cable entre cada uno.',
               recta: 'Tocá puntos en el mapa. Se suma la distancia en línea recta.',
               corte: 'Tocá desde dónde se midió (una botella o un punto del cable) y escribí los metros medidos.'}[modo];
      if (modo !== 'recta' && !tramos.length) t = 'Este recorrido no tiene cable dibujado.';
      document.getElementById('mAyuda').textContent = t;
    }
    function punto(ll, cls, html) {
      L.marker(ll, {icon: L.divIcon({className: cls, html: html || '', iconSize: cls === 'corteicon' ? [28, 28] : [14, 14]}),
        interactive: cls === 'corteicon'}).addTo(capaMed);
    }
    function botellaCerca(ll) {
      var mejor = -1, dm = Infinity;
      bots.forEach(function (b, i) { var x = ll.distanceTo([b.lat, b.lon]); if (x < dm) { dm = x; mejor = i; } });
      return mejor < 0 ? '' : 'a ' + mm(dm) + ' de la botella ' + (mejor + 1) + ' (' + esc(bots[mejor].nombre) + ')';
    }
    function dibujar() {
      capaMed.clearLayers();
      var txt = '—', out = document.getElementById('mDist');
      pts.forEach(function (p) { punto(p.ll, 'medpt'); });
      if (modo === 'recta' && pts.length > 1) {
        var lls = pts.map(function (p) { return p.ll; }), m = 0;
        for (var k = 1; k < lls.length; k++) m += lls[k - 1].distanceTo(lls[k]);
        L.polyline(lls, {color: '#f59e0b', weight: 4, dashArray: '8 6'}).addTo(capaMed);
        txt = mm(m) + ' en línea recta' + conGanancia(m);
      } else if (modo === 'cable' && pts.length > 1) {
        var total = 0, roto = false;
        for (var j = 1; j < pts.length; j++) {
          var r = porCable(pts[j - 1].p, pts[j].p);
          if (r.m < Infinity) { total += r.m; L.polyline(r.linea, {color: '#f59e0b', weight: 7, opacity: .9}).addTo(capaMed); }
          else roto = true;
        }
        txt = mm(total) + ' por el cable' + (pts.length > 2 ? ' (' + (pts.length - 1) + ' tramos)' : '') + conGanancia(total) +
              (roto ? '<small>Algún punto no está unido por el cable y no se sumó</small>' : '');
      } else if (modo === 'cable' && pts.length === 1) {
        txt = 'Tocá el siguiente punto';
      } else if (modo === 'corte') {
        var med = parseFloat(String(inMet.value).replace(',', '.'));
        if (!pts.length) txt = 'Tocá el punto desde donde se midió' +
          '<br><button type="button" class="mini yo" id="mYo">◎ Desde mi ubicación</button>';
        else if (!(med > 0)) txt = 'Escribí los metros medidos';
        else {
          var D = med * (1 - gan() / 100), r2 = aDistancia(pts[0].p, D);
          if (!r2.puntos.length) {
            txt = 'El cable termina antes' + '<small>Desde ese punto hay como máximo ' + mm(r2.maximo) + ' de cable en el mapa</small>';
          } else {
            var b, cands = r2.puntos, todas = elegidas.indexOf('todas') >= 0;
            while (!todas && (b = bifurcacion(cands))) {
              var ya = b.ramas.filter(function (r) { return elegidas.indexOf(r.nodo) >= 0; })[0];
              if (!ya) break;
              cands = cands.filter(function (c, i) { return b.grupo.indexOf(i) < 0 || ya.cands.indexOf(i) >= 0; });
            }
            if (b && !todas) {
              L.polyline(b.comun, {color: '#f59e0b', weight: 6, opacity: .85}).addTo(capaMed);
              var bot = '';
              b.ramas.forEach(function (r, j) {
                r.cands.forEach(function (i) {
                  L.polyline(cands[i].linea.slice(b.desde), {color: COL_RAMA[j % 5], weight: 6, opacity: .9}).addTo(capaMed);
                });
                L.polyline(r.vista, {color: COL_RAMA[j % 5], weight: 5, opacity: .55}).addTo(capaMed);
                var fin = r.vista[r.vista.length - 1], cerca = null, dm = 500;
                bots.forEach(function (o) { var x = fin.distanceTo([o.lat, o.lon]); if (x < dm) { dm = x; cerca = o; } });
                bot += '<button type="button" class="rama" data-nodo="' + r.nodo + '" style="color:' + COL_RAMA[j % 5] + '">● Rama ' +
                       NOM_RAMA[j % 5] + (cerca ? '<small>→ ' + esc(cerca.nombre) + '</small>' : '') + '</button>';
              });
              L.marker(b.punto, {icon: L.divIcon({className: 'bificon', iconSize: [16, 16]}), zIndexOffset: 1500, interactive: false}).addTo(capaMed);
              txt = 'El cable se bifurca · ¿por dónde sigue?<small>A ' + mm(b.metros) + ' del punto tocado (cuadrado naranja) el cable se abre. ' +
                    'Elegí la rama por la que va el enlace.</small><div class="ramas">' + bot +
                    '<button type="button" class="rama todas" data-nodo="todas">Mostrar todas</button></div>';
              out.innerHTML = txt;
              document.getElementById('mAyuda').hidden = true;
              return;
            }
            r2 = {puntos: cands, maximo: r2.maximo};
            txt = 'Corte a ' + mm(D) + ' sobre el mapa' + '<small>' + mm(med) + ' medidos − ' + gan() + '% de ganancia · ' +
                  r2.puntos.length + (r2.puntos.length === 1 ? ' posición' : ' posiciones (una por cada dirección)') + '</small>';
            r2.puntos.forEach(function (c, n) {
              L.polyline(c.linea, {color: '#f59e0b', weight: 6, opacity: .85}).addTo(capaMed);
              var mk = L.marker(c.q, {icon: L.divIcon({className: 'corteicon', html: '✂', iconSize: [28, 28]}), zIndexOffset: 2000});
              mk.bindPopup('<b>Punto de corte ' + (r2.puntos.length > 1 ? (n + 1) : '') + '</b><br>' + botellaCerca(c.q) +
                '<br>' + c.q.lat.toFixed(6) + ', ' + c.q.lng.toFixed(6) +
                '<br><a href="' + ruta(c.q.lat.toFixed(6), c.q.lng.toFixed(6)) + '" target="_blank" rel="noopener">Cómo llegar ↗</a>');
              mk.addTo(capaMed);
              if (r2.puntos.length === 1) setTimeout(function () { mk.openPopup(); }, 50);
            });
          }
        }
      }
      out.innerHTML = txt;
      // en Corte el título ya dice qué hacer: sin texto gris de ayuda
      document.getElementById('mAyuda').hidden = pts.length > 0 || (modo === 'corte' && tramos.length > 0);
    }
    var fijado = false;
    function fijar(on) {
      fijado = on;
      var b = document.getElementById('mFijar');
      b.classList.toggle('on', on); b.textContent = on ? '🔒' : '🔓'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    function agregarPunto(ll, forzar) {
      if (fijado && !forzar) {            // medición fijada: un toque sin querer no la mueve
        var f = document.getElementById('mFijar');
        f.classList.remove('sacude'); void f.offsetWidth; f.classList.add('sacude');
        return;
      }
      if (modo === 'recta') { pts.push({ll: ll}); dibujar(); return; }
      if (!tramos.length) return;
      var p = proyectar(ll);
      if (!p) return;
      if (modo === 'corte') { pts = []; elegidas = []; }
      pts.push({ll: p.q, p: p});
      dibujar();
      if (modo === 'corte' && !inMet.value) inMet.focus();
    }
    function setModo(m) {
      fijar(false);
      modo = m; pts = []; elegidas = [];
      ['cable', 'recta', 'corte'].forEach(function (x) {
        document.getElementById('m' + x.charAt(0).toUpperCase() + x.slice(1)).classList.toggle('on', m === x);
      });
      document.getElementById('mMetros').parentNode.hidden = m !== 'corte';
      if (m === 'corte' && sel >= 0) agregarPunto(L.latLng(bots[sel].lat, bots[sel].lon), true);
      ayuda(); dibujar();
    }
    function regla_(on) {
      midiendo = on; regla.hidden = !on; btnRegla.classList.toggle('on', on);
      btnRegla.innerHTML = on ? '<span aria-hidden="true">✕</span> Terminar' : '<span aria-hidden="true">📏</span> Medir';
      if (!on) { fijar(false); pts = []; capaMed.clearLayers(); }
      else {
        var hoja = document.getElementById('hoja');
        hoja.parentNode.style.setProperty('--h', '62px');
        ayuda(); dibujar();
      }
    }
    mapa.on('click', function (e) { if (midiendo) agregarPunto(e.latlng); });
    document.getElementById('mCable').onclick = function () { setModo('cable'); };
    document.getElementById('mRecta').onclick = function () { setModo('recta'); };
    document.getElementById('mCorte').onclick = function () { setModo('corte'); };
    document.getElementById('mBorrar').onclick = function () { fijar(false); pts = []; elegidas = []; inMet.value = ''; dibujar(); };
    document.getElementById('mFijar').onclick = function () { fijar(!fijado); };
    function desdeMiUbicacion(bt) {
      if (!navigator.geolocation) { bt.textContent = 'Este celular no comparte la ubicación'; return; }
      bt.textContent = 'Buscando tu ubicación…'; bt.disabled = true;
      navigator.geolocation.getCurrentPosition(function (pos) {
        var ll = L.latLng(pos.coords.latitude, pos.coords.longitude), p = proyectar(ll);
        if (!p) { bt.disabled = false; bt.textContent = '◎ Desde mi ubicación'; return; }
        var lejos = ll.distanceTo(p.q);
        agregarPunto(ll, true);
        mapa.setView(p.q, Math.max(mapa.getZoom(), 17));
        document.getElementById('mAyuda').hidden = false;
        document.getElementById('mAyuda').textContent = 'Tomé tu ubicación (±' + Math.round(pos.coords.accuracy) + ' m)' +
          (lejos > 15 ? ', a ' + mm(lejos) + ' del cable: usé el punto del cable más cercano.' : '.');
      }, function () {
        bt.disabled = false; bt.textContent = 'No pude obtener tu ubicación. Revisá el permiso.';
      }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 10000});
    }
    document.getElementById('mDist').addEventListener('click', function (e) {
      var yb = e.target.closest && e.target.closest('#mYo');
      if (yb) { desdeMiUbicacion(yb); return; }
      var bt = e.target.closest && e.target.closest('.rama');
      if (!bt) return;
      var n = bt.getAttribute('data-nodo');
      elegidas.push(n === 'todas' ? 'todas' : +n);
      dibujar();
    });
    document.getElementById('mCerrar').onclick = function () { regla_(false); };
    inMet.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); inMet.blur(); dibujar(); } });
    document.getElementById('mBuscar').onclick = function () { inMet.blur(); dibujar(); };
    inGan.addEventListener('change', function () { try { localStorage.setItem('ganancia', inGan.value); } catch (e) {} dibujar(); });
    inGan.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); inGan.blur(); } });

    var btnRegla;
    var Herr = L.Control.extend({ options: {position: 'topright'}, onAdd: function () {
      var cont = L.DomUtil.create('div', 'herr');
      btnRegla = L.DomUtil.create('a', 'medir', cont);
      btnRegla.href = '#'; btnRegla.title = 'Medir distancias sobre el cable'; btnRegla.setAttribute('role', 'button');
      btnRegla.innerHTML = '<span aria-hidden="true">📏</span> Medir';
      var box = L.DomUtil.create('div', 'leaflet-bar', cont);
      var yoB = L.DomUtil.create('a', 'ctl', box);
      yoB.href = '#'; yoB.title = 'Mi ubicación'; yoB.setAttribute('role', 'button'); yoB.innerHTML = '◎'; yoB.style.color = '#1a73e8';
      L.DomEvent.disableClickPropagation(cont);
      L.DomEvent.on(btnRegla, 'click', function (e) { L.DomEvent.preventDefault(e); regla_(!midiendo); });
      L.DomEvent.on(yoB, 'click', function (e) { L.DomEvent.preventDefault(e); ubicar(); });
      return cont;
    }});
    mapa.addControl(new Herr());
    L.DomEvent.disableClickPropagation(regla);

    var yo = null;
    function ubicar() {
      var msg = document.getElementById('msg');
      if (!navigator.geolocation) { msg.textContent = 'Este celular no comparte la ubicación.'; return; }
      msg.textContent = 'Buscando tu ubicación…';
      navigator.geolocation.getCurrentPosition(function (pos) {
        msg.textContent = '';
        var p = [pos.coords.latitude, pos.coords.longitude];
        if (yo) yo.setLatLng(p); else yo = L.marker(p, {icon: L.divIcon({className: 'yoicon', iconSize: [16, 16]}), interactive: false}).addTo(mapa);
        mapa.setView(p, 16);
      }, function () {
        msg.textContent = 'No pude obtener tu ubicación. Revisá que el permiso de ubicación esté activado.';
      }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
    }
  }
})();
</script>
</body>
</html>
