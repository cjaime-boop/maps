<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1d5bd8">
<title>Mapas Mobisond</title>
<meta property="og:title" content="Mapas Mobisond">
<link rel="manifest" href="mapas.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="app-192.png">
<link rel="apple-touch-icon" href="app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapas Mobisond">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:description" content="Mantenimiento - Mobisond">
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #172033; --muted: #5d6779; --line: #dbe1ea; --soft: #f4f6fa;
  --accent: #1d5bd8; --accent-soft: #e6eefc; --warn: #b45309; --rojo: #dc2626;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f141d; --surface: #182030; --ink: #e8edf6; --muted: #9aa5b8; --line: #2a3446; --soft: #1e2739;
  --accent: #6f9cf5; --accent-soft: #1f2d48; --warn: #f5c27a; --rojo: #e05c5c; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
.app { max-width: 720px; margin: 0 auto; background: var(--surface); min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px;
  font-weight: 600; font-size: 15px; cursor: pointer; }
.btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; }

.login { margin: auto; width: min(340px, 90%); display: grid; gap: 12px; text-align: center; padding: 30px 0; }
.login img { width: 64px; height: 64px; margin: 0 auto; }
.login h1 { margin: 0; font-size: 20px; }
.login p { margin: 0; color: var(--muted); font-size: 14px; }
.login input { padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); font-size: 16px; }
.pass { position: relative; display: flex; }
.pass input { flex: 1; min-width: 0; padding-right: 50px; }
.ojo { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0;
  background: none; color: var(--muted); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.ojo:active { background: var(--accent-soft); }
.login .err { color: var(--rojo); font-size: 13px; min-height: 1em; }

header { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: max(12px, env(safe-area-inset-top, 0px)) 14px 10px; display: grid; gap: 9px; }
.fila { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.logo.grande { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto; }
.fila h1 { margin: 0; font-size: 18px; flex: 1; }
.fila small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; margin-top: 1px; }
.recargar { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; width: 38px; height: 38px;
  font-size: 17px; cursor: pointer; color: var(--muted); }
.recargar.gira { animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.busca { display: flex; align-items: center; gap: 8px; background: var(--soft); border: 1px solid var(--line);
  border-radius: 12px; padding: 0 10px; }
.busca:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.busca svg { color: var(--muted); flex: none; }
.busca input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 11px 0; font-size: 16px; outline: none; }
.busca input::-webkit-search-cancel-button { display: none; }

.lista { padding: 6px 0 calc(16px + env(safe-area-inset-bottom, 0px)); }
.mapa { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px;
  border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.mapa:active { background: var(--accent-soft); }
.ic { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; }
.tx { min-width: 0; }
.tx b { display: block; font-size: 15px; overflow-wrap: anywhere; line-height: 1.25; }
.tx span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.vence { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; text-align: right; }
.vence.pronto { color: var(--warn); }
.vence i { display: block; font-style: normal; font-size: 18px; color: var(--muted); margin-top: 1px; }
.vacio { text-align: center; color: var(--muted); padding: 40px 20px; display: grid; gap: 6px; }
.vacio b { color: var(--ink); font-size: 16px; }
.instalar { margin: 10px 14px 4px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft);
  display: flex; align-items: center; gap: 12px; }
.instalar img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.instalar div { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.instalar div b { display: block; color: var(--ink); font-size: 14.5px; }
.instalar .btn { padding: 9px 14px; font-size: 14px; }
.salir { margin: 18px auto 8px; display: block; background: none; border: 0; color: var(--muted); font-size: 13px;
  text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
  'use strict';
  var SUPABASE = 'https://gnqvhlpknxtdnzuxfybc.supabase.co';
  var CLAVE = 'sb_publishable_dUhjyCfRfNtLVLfOYnJ1WA_hfPD3kk9';
  // contraseña propia del menú (no es la del Historial). Se guarda solo su huella, no la contraseña.
  var HUELLA = '7f8fe1ecb33e7de6e379ef7eebd1a9b263828ab8f087479d164498bac1c9302b';
  var app = document.getElementById('app');
  var OJO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var OJO_TACHADO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

  function huella(txt) {
    var datos = new TextEncoder().encode('mobisond-mapas:' + txt);
    return crypto.subtle.digest('SHA-256', datos).then(function (h) {
      return Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function adentro() { return ls('mp_ok') === HUELLA; }
  function pedir(ruta) {
    return fetch(SUPABASE + ruta, {cache: 'no-store', headers: {apikey: CLAVE, Authorization: 'Bearer ' + CLAVE}})
      .then(function (r) { if (!r.ok) throw new Error('Error ' + r.status); return r.json(); });
  }

  // ---------------- login
  function pantallaLogin(msg) {
    app.innerHTML = '<form class="login" id="fl"><span class="logo grande"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span>' +
      '<h1>Mapas activos</h1><p>Mantenimiento - Mobisond</p>' +
      '<div class="pass"><input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña" required>' +
      '<button class="ojo" id="ojo" type="button" aria-label="Mostrar contraseña">' + OJO + '</button></div>' +
      '<button class="btn prim" type="submit">Entrar</button><div class="err" id="err">' + esc(msg || '') + '</div></form>';
    document.getElementById('ojo').onclick = function () {
      var c = document.getElementById('clave'), ver = c.type === 'password';
      c.type = ver ? 'text' : 'password';
      this.innerHTML = ver ? OJO_TACHADO : OJO;
      this.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
      c.focus();
    };
    document.getElementById('fl').onsubmit = function (ev) {
      ev.preventDefault();
      var b = ev.target.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
      huella(document.getElementById('clave').value).then(function (h) {
        if (h !== HUELLA) throw new Error('mal');
        ls('mp_ok', h); pantallaLista();
      }).catch(function () {
        b.disabled = false; b.textContent = 'Entrar';
        document.getElementById('err').textContent = 'Contraseña incorrecta.';
      });
    };
  }

  // ---------------- lista
  var mapas = [];
  function cuanto(ms) {
    var m = Math.max(0, Math.round(ms / 60000));
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60);
    return h < 48 ? h + ' h' : Math.round(h / 24) + ' días';
  }
  function hace(ms) {
    var m = Math.round(ms / 60000);
    if (m < 1) return 'recién';
    if (m < 60) return 'hace ' + m + ' min';
    var h = Math.round(m / 60);
    return h < 48 ? 'hace ' + h + ' h' : 'hace ' + Math.round(h / 24) + ' días';
  }
  function norm(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[\s_\-.]+/g, ''); }

  function pantallaLista() {
    app.innerHTML = '<header><div class="fila"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span>' +
      '<h1>Mapas activos<small id="cuenta">Cargando…</small></h1>' +
      '<button class="recargar" id="rec" type="button" aria-label="Actualizar">↻</button></div>' +
      '<label class="busca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
      'stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar mapa" aria-label="Buscar mapa"></label>' +
      '</header><div id="inst"></div><div class="lista" id="lista"></div><button class="salir" id="salir" type="button">Salir</button>';
    ofrecerInstalar();
    document.getElementById('rec').onclick = cargar;
    document.getElementById('q').oninput = pintar;
    document.getElementById('salir').onclick = function () { ls('mp_ok', null); pantallaLogin(); };
    cargar();
  }

  function cargar() {
    var rec = document.getElementById('rec'); rec.classList.add('gira');
    var ahora = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    // la lista es la misma que ve el plugin en "Links activos"
    pedir('/rest/v1/links_tecnicos?select=codigo,titulo,autor,creado,vence&vence=gt.' + ahora +
          '&order=creado.desc&limit=300').then(function (filas) {
      mapas = (filas || []).filter(function (f) { return f.codigo; });
      pintar();
    }).catch(function () {
      document.getElementById('lista').innerHTML = '<div class="vacio"><b>No pude traer la lista</b>' +
        '<span>Revisá la conexión y tocá ↻.</span></div>';
      document.getElementById('cuenta').textContent = 'Sin conexión';
    }).then(function () { var r = document.getElementById('rec'); if (r) r.classList.remove('gira'); });
  }

  function pintar() {
    var q = norm(document.getElementById('q').value), ahora = Date.now();
    var vis = mapas.filter(function (m) { return !q || norm(m.titulo).indexOf(q) >= 0 || norm(m.autor).indexOf(q) >= 0; });
    document.getElementById('cuenta').textContent = mapas.length ?
      (q ? vis.length + ' de ' + mapas.length : mapas.length + (mapas.length === 1 ? ' mapa vigente' : ' mapas vigentes')) : 'Ninguno vigente';
    var ic = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
             'stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>';
    document.getElementById('lista').innerHTML = vis.length ? vis.map(function (m) {
      var resta = new Date(m.vence).getTime() - ahora, creado = new Date(m.creado).getTime();
      return '<a class="mapa" href="./#' + encodeURIComponent(m.codigo) + '"><span class="ic">' + ic + '</span>' +
        '<span class="tx"><b>' + esc(m.titulo || 'Recorrido') + '</b><span>' +
        esc([m.autor, isNaN(creado) ? '' : hace(ahora - creado)].filter(Boolean).join(' · ')) + '</span></span>' +
        '<span class="vence' + (resta < 3 * 3600000 ? ' pronto' : '') + '">vence en ' + cuanto(resta) + '<i>›</i></span></a>';
    }).join('') : '<div class="vacio">' + (mapas.length ? '<b>Ningún mapa coincide</b>' :
      '<b>No hay mapas vigentes</b><span>Pedile a un dispatcher que lo genere.</span>') + '</div>';
  }

  // ---------------- instalar como app (ícono "Mapas Mobisond" en la pantalla de inicio)
  var avisoInstalar = null;
  var instalada = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); avisoInstalar = e; ofrecerInstalar(); });
  window.addEventListener('appinstalled', function () { instalada = true; ofrecerInstalar(); });
  function ofrecerInstalar() {
    var c = document.getElementById('inst');
    if (!c) return;
    if (instalada || ls('mp_no_instalar') || (!avisoInstalar && !esIOS)) { c.innerHTML = ''; return; }
    c.innerHTML = '<div class="instalar"><img src="app-192.png" alt=""><div><b>Instalar Mapas Mobisond</b>' +
      (avisoInstalar ? 'Queda el ícono en la pantalla de inicio.' :
       'Tocá <b style="display:inline">Compartir</b> ⬆︎ y después <b style="display:inline">Agregar a inicio</b>.') + '</div>' +
      (avisoInstalar ? '<button class="btn prim" id="bInst" type="button">Instalar</button>' : '') +
      '<button class="ojo" id="bNo" type="button" aria-label="No mostrar más" style="position:static;transform:none">✕</button></div>';
    var bi = document.getElementById('bInst');
    if (bi) bi.onclick = function () {
      avisoInstalar.prompt();
      avisoInstalar.userChoice.then(function () { avisoInstalar = null; ofrecerInstalar(); });
    };
    document.getElementById('bNo').onclick = function () { ls('mp_no_instalar', '1'); ofrecerInstalar(); };
  }
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

  if (adentro()) pantallaLista(); else pantallaLogin();
})();
</script>
</body>
</html>
